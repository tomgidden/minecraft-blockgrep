modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "icon.png"
description = """
Highlights every occurrence of configured block patterns near you.
Entirely client-side: it reads blocks the client already has and draws
boxes locally, so it is safe on servers that do not have it installed.
"""

[[dependencies.blockgrep]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version_min},27)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.blockgrep]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version_min},27)"
ordering = "NONE"
side = "CLIENT"
