# Thin caller for the shared pipeline, which lives in
# https://github.com/tomgidden/minecraft-mod-build-and-publish and is
# documented there. Everything mod-specific is in .github/release/.
#
# Every tag builds; the tag's shape decides what gets published:
#
#   26.0.1            GitHub release + Modrinth + CurseForge
#   26.0.1-pre1       GitHub release only, marked prerelease
#   anything else     build only, nothing published
#
# A manual run builds and makes a prerelease GitHub release, and publishes to
# Modrinth/CurseForge only if the matching box is ticked.

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      modrinth:
        description: 'Also publish to Modrinth'
        type: boolean
        default: false
      curseforge:
        description: 'Also publish to CurseForge'
        type: boolean
        default: false
  push:
    tags:
      - '*'

jobs:
  call:
    uses: tomgidden/minecraft-mod-build-and-publish/.github/workflows/build-and-release.yml@v1
    permissions:
      contents: write
    with:
      # inputs.* is null on a tag push, and null fails the boolean type check.
      modrinth: ${{ inputs.modrinth || false }}
      curseforge: ${{ inputs.curseforge || false }}
      # Passed explicitly: a called workflow cannot see the caller's `vars`.
      # (The tokens need no such help -- `secrets: inherit` covers them.)
      #
      # Only `github, needs, strategy, matrix, inputs, vars` are available
      # here -- `secrets` is NOT -- so a repo holding its ids as secrets
      # instead leaves these empty and the shared workflow falls back to
      # secrets.*_ID on its side, where the context does exist.
      modrinth_id: ${{ vars.MODRINTH_ID }}
      curseforge_id: ${{ vars.CURSEFORGE_ID }}
    secrets: inherit
